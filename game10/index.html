<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Can't Stop · 联机版</title>
  <link rel="stylesheet" href="/shared/styles/base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div><p class="eyebrow">PUSH YOUR LUCK</p><h1>CAN'T <span>STOP</span></h1></div>
    <div id="connectionStatus" class="connection-pill" data-status="idle">尚未连接</div>
  </header>

  <main>
    <section id="setupPanel" class="setup-shell">
      <article class="intro-card">
        <div class="mountain-mark">▲</div>
        <h2>再掷一次，还是见好就收？</h2>
        <p>组合四颗骰子，派出三名登山者。只要一次无路可走，本回合的攀登就会全部归零。</p>
      </article>
      <article class="setup-card">
        <div class="mode-switch"><button id="hostModeButton" class="active" type="button">创建房间</button><button id="guestModeButton" type="button">加入房间</button></div>
        <div id="hostSetup" class="setup-form">
          <label>你的名字<input id="hostNameInput" maxlength="12" placeholder="房主"></label>
          <label>游戏人数<select id="playerCountSelect"><option value="2">2 人</option><option value="3" selected>3 人</option><option value="4">4 人</option></select></label>
          <button id="createRoomButton" class="primary" type="button">创建游戏</button>
        </div>
        <div id="guestSetup" class="setup-form hidden">
          <label>你的名字<input id="guestNameInput" maxlength="12" placeholder="玩家"></label>
          <label>四位房间号<input id="roomCodeInput" maxlength="4" autocomplete="off" placeholder="ABCD"></label>
          <button id="joinRoomButton" class="primary" type="button">加入游戏</button>
        </div>
        <p class="setup-note">2–4 人 · 率先占领三条路线获胜</p>
      </article>
    </section>

    <section id="roomPanel" class="room-shell hidden">
      <div class="room-toolbar">
        <div><span class="muted">房间</span><strong id="roomCodeDisplay">----</strong></div>
        <div id="hostTools" class="host-tools">
          <label>人数<select id="roomPlayerCountSelect"><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label>
          <button id="startGameButton" class="primary" type="button">开始游戏</button>
          <button id="endGameButton" class="danger hidden" type="button">结束本局</button>
        </div>
      </div>

      <div class="game-layout">
        <aside class="side-panel panel">
          <div class="panel-title"><span>登山队</span><b id="playerCountBadge">0 / 3</b></div>
          <div id="playerList" class="player-list"></div>
          <div class="legend"><span><i class="tent-dot"></i>已扎营</span><span><i class="runner-dot"></i>本回合</span></div>
        </aside>

        <section class="board-panel panel">
          <div class="round-meta"><span id="phaseBadge" class="phase-badge">准备阶段</span><span id="turnLabel">等待开始</span></div>
          <p id="notice" class="notice">等待玩家加入房间</p>
          <div id="board" class="mountain-board"></div>
          <div class="timer-box"><div><span>行动时间</span><b id="timerText">--</b></div><div class="shared-timer-track"><div id="timerBar" class="shared-timer-bar"></div></div></div>
        </section>

        <aside class="action-panel panel">
          <div class="dice-title"><span>四颗骰子</span><b id="diceTotal"></b></div>
          <div id="diceArea" class="dice-area"><span class="die empty">?</span><span class="die empty">?</span><span class="die empty">?</span><span class="die empty">?</span></div>
          <div id="actionArea" class="action-area"></div>
          <div class="panel-title log-title"><span>游戏记录</span><button id="toggleLogButton" type="button">收起</button></div>
          <div id="logList" class="log-list"></div>
        </aside>
      </div>

      <section id="resultPanel" class="result-panel panel hidden"><p class="eyebrow">SUMMIT REACHED</p><h2 id="winnerText">本局结束</h2><div id="resultList"></div></section>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
