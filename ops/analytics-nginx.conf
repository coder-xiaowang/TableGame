# Include once inside http {}. Add the access_log directive below to each production server.
map $request_uri $tablegame_entry {
    default "";
    ~^/(?:\?|$) root;
    ~^/index\.html(?:\?|$) index;
    ~^/tools/(?:index\.html)?(?:\?|$) tools;
    ~^/tools/puzzle/(?:index\.html)?(?:\?|$) puzzle;
    ~^/tools/bead-pattern/(?:index\.html)?(?:\?|$) beads;
    ~^/notes/(?:index\.html|articles/[a-zA-Z0-9_-]+/(?:index\.html)?)?(?:\?|$) notes;
}
map $http_user_agent $tablegame_human {
    default 1;
    "" 0;
    ~*(bot|crawl|spider|headless|healthcheck|uptimerobot|monitoring|curl/|wget/) 0;
}
map "$request_method:$status:$tablegame_human:$tablegame_entry" $tablegame_log {
    default 0;
    ~^GET:(200|304):1:.+ 1;
}
log_format tablegame_visit escape=json
    '{"id":"$request_id","at":"$time_iso8601","host":"$host","entry":"$tablegame_entry"}';
# In the main site and each listed game HTTPS server {} (keep existing access logs):
# access_log /var/log/nginx/tablegame-visits.log tablegame_visit if=$tablegame_log;
