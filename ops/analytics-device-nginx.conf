# Include in the zillionx.xyz HTTPS server only.
location = /analytics-device {
    alias /srv/tablegame/ops/analytics-device.html;
    default_type text/html;
    charset utf-8;
    add_header X-Tablegame-Audience $tablegame_audience always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
