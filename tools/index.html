<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5ddae">
    <title>实用工具箱</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header><a href="/">← 返回首页</a><span>SMALL TOOLS, WARM DAYS</span></header>
    <main>
      <section class="hero"><p>实用工具</p><h1>一些顺手的小工具，<br>替生活省下一点力气。</h1><span>所有能够在浏览器本地完成的工作，都尽量不上传你的数据。</span></section>
      <section class="tool-grid" aria-label="工具列表">
        <a class="tool-card bead-card" href="bead-pattern/">
          <span class="status">已开放</span>
          <div class="beads" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <p>PIXEL CRAFT</p><h2>拼豆图纸工坊</h2>
          <span>上传图片，自动匹配通用色卡；继续手工修图、统计用量并导出图纸。</span>
          <strong>开始制作 →</strong>
        </a>
        <a class="tool-card puzzle-card" href="puzzle/">
          <span class="status">已开放</span>
          <svg class="puzzle-icon" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
            <rect x="4" y="4" width="112" height="112" rx="22" fill="#397f84"/>
            <path d="M60 4v32c-18-12-18 24 0 12v24c18-12 18 24 0 12v32M4 60h32c-12-18 24-18 12 0h24c-12 18 24 18 12 0h32" fill="none" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round"/>
          </svg>
          <p>PICTURE PUZZLE</p><h2>拼图工坊</h2>
          <span>挑选内置画作或上传自己的图片，选择拼片风格，在浏览器里享受拼图时光。</span>
          <strong>开始拼图 →</strong>
        </a>
      </section>
    </main>
  </body>
</html>
