<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="按聚会人数和玩法挑选桌游，开一间房，邀请朋友同桌。">
  <meta name="theme-color" content="#faf7ef">
  <title>桌游大厅 · zillionx 的憩所</title>
  <link rel="stylesheet" href="lobby/styles.css">
  <script src="lobby/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="返回 zillionx 的憩所"><span class="die-mark" aria-hidden="true">⚄</span>zillionx 的憩所</a>
    <nav aria-label="大厅导航"><a href="/">返回首页</a><a href="index.html" aria-current="page">桌游大厅</a></nav>
  </header>
  <main>
    <section class="hero" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">今晚，想玩哪一桌<span>？</span></h1>
        <p>选好人数和玩法，开一间房，邀朋友入座。</p>
      </div>
    </section>

    <section class="catalog" aria-labelledby="catalog-title">
      <div class="filter-bar">
        <div class="count-filter">
          <label for="party-size">今晚几个人？</label>
          <select id="party-size"><option value="">人数不限</option></select>
        </div>
        <fieldset><legend>想玩什么类型？</legend><div id="types" class="types"></div></fieldset>
      </div>
      <div class="catalog-heading">
        <h2 id="catalog-title">可选游戏</h2>
        <span id="result-count" role="status"></span>
        <button type="button" id="reset" hidden>清除筛选</button>
      </div>
      <div class="games" id="games"></div>
      <p id="empty" hidden>这个人数和玩法暂时凑不成一桌。可以换个玩法，或清除筛选看看。</p>
      <noscript>请启用 JavaScript 以浏览和筛选游戏。</noscript>
    </section>
    <aside class="in-development" aria-label="开发中的游戏">开发中 <span>·</span> <a href="https://jo.zillionx.xyz">Just One ↗</a></aside>
  </main>
  <footer>© <span id="year"></span> zillionx 的憩所</footer>
</body>
</html>
