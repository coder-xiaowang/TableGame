<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>桌游大厅</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      color: #eef3ff;
      background:
        radial-gradient(circle at top, #233a67 0, transparent 45%),
        #0b1220;
      font-family:
        system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(100%, 1100px);
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 6vw, 56px);
    }

    header p {
      margin: 0;
      color: #aebdd5;
    }

    #games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .game {
      display: block;
      min-height: 145px;
      padding: 22px;
      color: inherit;
      text-decoration: none;
      border: 1px solid #31466b;
      border-radius: 18px;
      background: rgba(23, 36, 61, 0.88);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.18);
      transition: transform 150ms ease, border-color 150ms ease;
    }

    .game:hover {
      transform: translateY(-3px);
      border-color: #7da7ff;
    }

    .number {
      color: #7da7ff;
      font-size: 14px;
    }

    .game h2 {
      margin: 15px 0 8px;
      font-size: 22px;
    }

    .game p {
      margin: 0;
      color: #aebdd5;
      font-size: 14px;
    }

    footer {
      margin-top: 32px;
      color: #7889a5;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>桌游大厅</h1>
      <p>选择一个游戏，创建房间后把房间号分享给朋友。</p>
    </header>

    <section id="games"></section>

    <footer>
      测试版本：创建房间的玩家需要在整局中保持在线
    </footer>
  </main>

  <script>
    const games = [
      { port: 8787, name: "速速破译" },
      { port: 8788, name: "我话你猜" },
      { port: 8789, name: "快艇骰子" },
      { port: 8790, name: "德州扑克" },
      { port: 8791, name: "UNO" },
      { port: 8792, name: "牛头王" },
      { port: 8793, name: "马尼拉·港口大亨" },
      { port: 8794, name: "璀璨宝石·宝可梦版" },
      { port: 8795, name: "No Thanks!" },
      { port: 8796, name: "Can't Stop" },
      { port: 8797, name: "截码战" },
      { port: 8798, name: "Just One" },
      { port: 8799, name: "CABO" }
    ];

    const container = document.querySelector("#games");

    for (const [index, game] of games.entries()) {
      const link = document.createElement("a");
      link.className = "game";
      link.href =
        `${location.protocol}//${location.hostname}:${game.port}/`;

      const number = document.createElement("div");
      number.className = "number";
      number.textContent = `GAME ${index + 1}`;

      const title = document.createElement("h2");
      title.textContent = game.name;

      const description = document.createElement("p");
      description.textContent = `进入游戏`;

      link.append(number, title, description);
      container.append(link);
    }
  </script>
</body>
</html>
