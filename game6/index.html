<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>牛头王联机版</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">6 NIMMT! · ONLINE</p>
        <h1>牛头王</h1>
      </div>
      <div class="status" id="connectionStatus">准备连接</div>
    </header>

    <section id="setupPanel">
      <div class="mode-grid">
        <button class="mode active" id="hostModeButton" type="button">
          <b>创建房间</b><span>担任房主与规则裁判</span>
        </button>
        <button class="mode" id="guestModeButton" type="button">
          <b>加入房间</b><span>输入好友的四位房间号</span>
        </button>
      </div>

      <div class="panel setup-card" id="hostSetup">
        <div><p class="eyebrow">HOST A GAME</p><h2>建立牛头王牌桌</h2></div>
        <label>昵称<input id="hostNameInput" maxlength="12" autocomplete="off" value="房主"></label>
        <label>玩家人数
          <select id="playerCountSelect">
            <option value="2">2 人</option><option value="3">3 人</option>
            <option value="4" selected>4 人</option><option value="5">5 人</option>
            <option value="6">6 人</option><option value="7">7 人</option>
            <option value="8">8 人</option><option value="9">9 人</option>
            <option value="10">10 人</option>
          </select>
        </label>
        <button class="primary" id="createRoomButton" type="button">创建房间</button>
      </div>

      <div class="panel setup-card hidden" id="guestSetup">
        <div><p class="eyebrow">JOIN A GAME</p><h2>加入好友房间</h2></div>
        <label>昵称<input id="guestNameInput" maxlength="12" autocomplete="off" value="玩家"></label>
        <label>房间号<input id="roomCodeInput" maxlength="4" autocomplete="off" placeholder="例如 A7K2"></label>
        <button class="primary" id="joinRoomButton" type="button">加入房间</button>
      </div>
    </section>

    <section class="game-layout hidden" id="roomPanel">
      <aside class="sidebar">
        <div class="panel room-card">
          <p class="eyebrow">ROOM CODE</p>
          <div class="room-code" id="roomCodeDisplay">----</div>
          <div class="host-tools hidden" id="hostTools">
            <label>本房人数
              <select id="roomPlayerCountSelect">
                <option value="2">2 人</option><option value="3">3 人</option>
                <option value="4">4 人</option><option value="5">5 人</option>
                <option value="6">6 人</option><option value="7">7 人</option>
                <option value="8">8 人</option><option value="9">9 人</option>
                <option value="10">10 人</option>
              </select>
            </label>
            <button class="primary wide" id="startGameButton" type="button">开始游戏</button>
            <button class="danger wide hidden" id="endGameButton" type="button">结束当前游戏</button>
          </div>
        </div>

        <div class="panel">
          <div class="section-head"><h2>玩家</h2><span id="playerCountBadge">0 / 0</span></div>
          <div class="player-list" id="playerList"></div>
        </div>

        <div class="panel rules">
          <p class="eyebrow">本房规则</p>
          <p>每人 10 张牌，累计 66 个牛头后结束。成为第六张牌时收走前五张；无牌可接时自行选列。</p>
          <p>选牌和选列均限时 15 秒，超时随机处理。</p>
        </div>
      </aside>

      <section class="table-area">
        <div class="notice" id="notice">等待玩家加入。</div>

        <div class="panel reveal-panel hidden" id="revealPanel">
          <div class="section-head">
            <div><p class="eyebrow">REVEALED PLAYS</p><h2>本轮公开出牌</h2></div>
            <span class="reveal-progress" id="revealProgress"></span>
          </div>
          <div class="revealed-plays" id="revealedPlays"></div>
        </div>

        <div class="panel board-panel">
          <div class="section-head">
            <div><p class="eyebrow">CARD ROWS</p><h2>桌面牌列</h2></div>
            <div class="badges"><span id="roundBadge">第 0 局</span><span id="turnBadge">第 0 / 10 回合</span></div>
          </div>
          <div class="rows" id="rows"></div>
        </div>

        <div class="panel action-panel">
          <div class="action-head">
            <div><p class="eyebrow">ACTION</p><h2 id="actionTitle">等待开始</h2></div>
            <div class="timer"><b id="timerText">--</b><i id="timerBar"></i></div>
          </div>
          <div class="actions" id="actionArea"></div>
        </div>

        <div class="panel hand-panel">
          <div class="section-head">
            <div><p class="eyebrow">YOUR HAND</p><h2>我的手牌 <span id="handCount">0</span></h2></div>
            <span class="selection-state" id="selectionState"></span>
          </div>
          <div class="hand" id="hand"></div>
        </div>

        <div class="panel log-panel">
          <div class="section-head">
            <h2>游戏记录</h2>
            <button class="small" id="toggleLogButton" type="button">展开 / 收起</button>
          </div>
          <div class="log" id="logList"></div>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
